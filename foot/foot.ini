[main]
font=Iosevka:size=12
font-bold=Iosevka:weight=bold:size=12
font-italic=Iosevka:slant=oblique:size=12
font-bold-italic=Iosevka:weight=bold:slant=oblique:size=12
line-height=14
letter-spacing=0
pad=12x12 center
dpi-aware=no
term=foot
initial-window-size-pixels=1280x800

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
color=252525 ffffff

[mouse]
hide-when-typing=yes

[colors]
alpha=0.95
foreground=ffffff
background=252525
selection-foreground=252525
selection-background=f5e0dc
urls=3b82f6

regular0=3a3a3a
regular1=ff3b5c
regular2=4dff88
regular3=ffc12e
regular4=3d8bff
regular5=d946ef
regular6=1fd2f0
regular7=d4d4d4

bright0=6b6b6b
bright1=ff6680
bright2=8affb0
bright3=ffd75e
bright4=6aa8ff
bright5=ee7bff
bright6=5ee6ff
bright7=ffffff

[key-bindings]
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
