bar {
    status_command i3status
    position top
    font pango:JetBrains Mono, Font Awesome 10
    
    colors {
        background #1a1a1a
        statusline #00ff9f
        separator #666666
        
        focused_workspace  #00ff9f #00ff9f #000000
        active_workspace   #333333 #222222 #888888
        inactive_workspace #222222 #222222 #888888
        urgent_workspace   #ff0055 #ff0055 #ffffff
        binding_mode       #ffaa00 #ffaa00 #000000
    }
}

# Clean, modern spacing
gaps inner 4

# Keep minimal borders for separation
default_border pixel 1

#corner_radius 5
#shadows enable
