output eDP-1 resolution 1920x1200 position 0,0
output HDMI-A-1 resolution 1280x800@60hz position 0,1200
output DP-1 mode --custom 3440x1440@175hz position 1920,0

# Start btop on mini monitor
workspace 10 output HDMI-A-1
exec swaymsg 'workspace 10; exec foot -e btop'

output * bg ~/dotfiles/wallpapers/merlin.png fill

bindswitch --reload --locked lid:on output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable
